name: Refresh skill data

# 用途：增量补齐正式服新增的角色/光锥（可选刷新怪物索引），改动以 PR 交付供人工 review。
#
# 触发方式：
#   1) 手动（默认）：Actions 页 → 本 workflow → "Run workflow"，可勾选 dry-run / 刷新怪物索引。
#   2) 定时（可选，默认关闭）：解开下方 schedule 注释并按需改 cron。
#      每个版本时长不同，建议按当期上线/中期时间点临时设定，用完再注释掉。
#      cron 为 UTC；北京时间 = UTC+8。例：'0 4 * * 1' = 每周一 UTC 04:00 = 北京时间 12:00。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只检测缺口，不生成/不开 PR'
        type: boolean
        default: false
      with_monsters:
        description: '同时刷新 mapping-monster.md（拉 nanoka 测试服版本）'
        type: boolean
        default: false
  # schedule:
  #   - cron: '0 4 * * 1'   # ← 自定义：解开这两行并改成你要的时间（UTC）

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Incremental refresh (detect & generate missing)
        run: |
          python3 scripts/ci_refresh.py \
            ${{ (github.event.inputs.dry_run == 'true') && '--dry-run' || '' }} \
            ${{ (github.event.inputs.with_monsters == 'true') && '--with-monsters' || '' }}

      - name: Open PR if there are changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/refresh-skill-data
          delete-branch: true
          labels: automated, data
          title: 'chore(data): Refresh skill data (new characters/lightcones)'
          commit-message: |
            chore(data): Refresh skill data via ci_refresh

            Auto-generated by the refresh-skill-data workflow: add characters
            and light cones newly ingested by Mar-7th StarRailRes (正式服).
          body: |
            由 `refresh-skill-data` workflow 自动生成（`scripts/ci_refresh.py`）。

            - 检测正式服（Mar-7th StarRailRes）已收录、本地 `references/` 缺失的角色/光锥并补齐。
            - 角色/光锥走 SRR（跟正式服），不会提前引入测试服 beta 内容。

            **合并前请人工核对**已知生成局限：强化技能空描述、强化终结技识别、忆灵/召唤物字段等。
